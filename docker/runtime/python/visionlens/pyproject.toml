[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "visionlens"
version = "0.1.0"
description = "Local-first visual AI runtime: deterministic simulated encoder, model registry, and the frozen visionlens.worker.v1 JSONL worker protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The base install carries the typed, versioned configuration of the public
# facade (Pydantic) and the image decoder (Pillow), and nothing else: the
# pack's base-install policy allows "limited I/O" when a core operation
# needs it, and forbids a mandatory GPU, PyTorch, Transformers or MLflow
# download (docs/vnext/05-PYTHON-CORE-AND-PYPI.md:34). The decision is
# recorded in the packaging amendments of ADR-011.
dependencies = ["pydantic>=2.12,<3", "pillow>=13,<14"]

[project.optional-dependencies]
# The extra names are frozen. The base install carries Pydantic and Pillow
# and nothing else, and every heavy stack lives behind its extra, so the
# base install never pulls a PyTorch or a Transformers download
# (docs/vnext/05-PYTHON-CORE-AND-PYPI.md:34, :35).
#
# The `vision` extra is the one this ticket fills: the encoder stack that
# reads a real checkpoint on the CPU (torch, transformers) and the format
# the loader publishes (safetensors). The `all` extra is the aggregate,
# spelled as a self reference so the pins live in one place.
vision = [
    "torch>=2.9,<3",
    "transformers>=4.57,<5",
    "safetensors>=0.6,<1",
]
# The `training` extra is the one this ticket fills: the estimator of the
# M0 rung (scikit-learn, with numpy under it), and the pin of joblib for
# the reader of the frozen feature artifact, which is the next piece of
# the ticket. Joblib arrives with scikit-learn anyway, and the explicit pin
# only narrows its range. The recipe imports none of it and the estimator imports the
# stack inside the fit, so the base install stays free of the heavy stack
# until a probe is trained. The checkpoint of a run is a JSON document and
# not a pickled estimator, so it needs no serialization library of its
# own.
training = [
    "scikit-learn>=1.7,<2",
    "numpy>=2.3,<3",
    "joblib>=1.5,<2",
]
agents = []
server = []
# The aggregate carries every capability extra, spelled as self references
# so the pins live in one place.
all = ["visionlens[vision]", "visionlens[training]"]

[tool.hatch.build.targets.wheel]
packages = ["src/visionlens"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[dependency-groups]
# Development workspace only: never published, never a wheel dependency.
# Ranges here, exact pins in uv.lock (regenerate with `uv lock`).
dev = ["pytest>=9", "mypy>=1.15"]

[tool.uv]
# Reproducible development resolution: nothing released after this instant
# can enter uv.lock. Recorded by uv in uv.lock's [manifest] section.
exclude-newer = "2026-11-12T00:00:00Z"

[tool.mypy]
# Type checker gate over the shipped sources; zero errors is the bar.
files = ["src/visionlens"]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

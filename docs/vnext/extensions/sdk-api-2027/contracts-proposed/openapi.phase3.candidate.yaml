openapi: 3.1.0
info:
  title: VisionLens P3 Candidate Job API (NON-AUTHORITATIVE)
  version: 0.0.0-proposal
  description: Proposal fixtures for discussion only. Generate deployed API from accepted
    Fastify/Zod route source. This deliberately specifies only vertical alpha job
    endpoints, not all planned asset or model routes.
servers:
- url: http://127.0.0.1:8787
  description: example loopback; not a running server
paths:
  /v1/capabilities:
    get:
      summary: Authorized capability negotiation
      operationId: listCapabilities
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401': &id001
          description: Typed API problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403': *id001
        '404': *id001
  /v1/jobs:
    post:
      summary: Submit idempotent async ML job
      operationId: submitJob
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmit'
      responses:
        '202':
          description: Accepted and durably persisted; replay returns existing job
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResource'
        '409': *id001
        '422': *id001
        '401': *id001
        '403': *id001
        '429': *id001
  /v1/jobs/{jobId}:
    get:
      summary: Get authorized job status
      operationId: getJob
      security:
      - bearerAuth: []
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResource'
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/jobs/{jobId}/events:
    get:
      summary: Subscribe to replayable SSE job event log
      operationId: streamJobEvents
      security:
      - bearerAuth: []
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        '410': *id001
        '401': *id001
        '403': *id001
  /v1/jobs/{jobId}/result:
    get:
      summary: Retrieve finished result metadata
      operationId: getJobResult
      security:
      - bearerAuth: []
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Result artifact refs and provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '409': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/jobs/{jobId}/cancel:
    post:
      summary: Request cooperative job cancellation
      operationId: cancelJob
      security:
      - bearerAuth: []
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '202':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResource'
        '401': *id001
        '403': *id001
        '404': *id001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    JobSubmit:
      type: object
      additionalProperties: false
      required:
      - operation
      - params
      - budget
      properties:
        operation:
          const: vision.predict
        params:
          type: object
          additionalProperties: false
          required:
          - taskKind
          - assetId
          - modelId
          properties:
            taskKind:
              const: image.classification
            assetId:
              type: string
              minLength: 1
              maxLength: 160
              pattern: ^[a-zA-Z0-9._:@-]+$
            modelId:
              type: string
              minLength: 1
              maxLength: 160
              pattern: ^[a-zA-Z0-9._:@-]+$
            options:
              type: object
              additionalProperties: false
              required: []
              properties:
                topK:
                  type: integer
                  minimum: 1
                  maximum: 100
        budget:
          type: object
          additionalProperties: false
          required:
          - maxSeconds
          - maxUsdMicro
          properties:
            maxSeconds:
              type: integer
              minimum: 1
              maximum: 86400
            maxUsdMicro:
              type: integer
              minimum: 0
            maxTokens:
              type: integer
              minimum: 0
      description: 'Alpha reference only: other CV tasks require explicit new accepted
        operation variants, not arbitrary params.'
    JobResource:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - jobId
          - operation
          - status
          - submittedAt
          - lastEventSequence
          properties:
            jobId:
              type: string
              minLength: 1
              maxLength: 160
              pattern: ^[a-zA-Z0-9._:@-]+$
            operation:
              const: vision.predict
            status:
              type: string
              enum:
              - queued
              - preparing
              - running
              - succeeded
              - failed
              - cancelled
              - expired
            submittedAt:
              type: string
              format: date-time
            lastEventSequence:
              type: integer
              minimum: 0
            finishedAt:
              anyOf:
              - type: string
                format: date-time
              - type: 'null'
            resultRef:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 160
                pattern: ^[a-zA-Z0-9._:@-]+$
              - type: 'null'
            cancelRequested:
              type: boolean
        meta:
          type: object
          additionalProperties: false
          required:
          - requestId
          - contractVersion
          properties:
            requestId:
              type: string
              minLength: 1
              maxLength: 160
              pattern: ^[a-zA-Z0-9._:@-]+$
            contractVersion:
              type: string
              pattern: ^\d+\.\d+\.\d+$
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - requestId
      - retryable
      properties:
        type:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        requestId:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[a-zA-Z0-9._:@-]+$
        retryable:
          type: boolean
    Capabilities:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - apiVersion
          - contractVersion
          - features
          properties:
            apiVersion:
              const: v1
            contractVersion:
              type: string
              pattern: ^\d+\.\d+\.\d+$
            features:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - taskKind
                - supportedByCode
                - installed
                - runnableOnDevice
                - allowedByPolicy
                - device
                - reasonCode
                properties:
                  taskKind:
                    enum:
                    - image.classification
                    - image.detection
                    - image.ocr
                    - image.ppe
                    - image.retrieval
                    - image.matting
                    - video.counting
                    - image.medical_research
                  supportedByCode:
                    type: boolean
                  installed:
                    type: boolean
                  runnableOnDevice:
                    type: boolean
                  allowedByPolicy:
                    type: boolean
                  device:
                    anyOf:
                    - enum:
                      - cpu
                      - mps
                      - cuda
                    - type: 'null'
                  reasonCode:
                    anyOf:
                    - type: string
                    - type: 'null'
        meta:
          type: object
          additionalProperties: false
          required:
          - requestId
          properties:
            requestId:
              type: string
              minLength: 1
              maxLength: 160
              pattern: ^[a-zA-Z0-9._:@-]+$
    JobEvent:
      type: object
      additionalProperties: false
      required:
      - jobId
      - seq
      - kind
      properties:
        jobId:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[a-zA-Z0-9._:@-]+$
        seq:
          type: integer
          minimum: 1
        kind:
          enum:
          - queued
          - progress
          - result
          - error
          - cancelled
          - heartbeat
        status:
          enum:
          - queued
          - preparing
          - running
          - succeeded
          - failed
          - cancelled
          - expired
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        resultRef:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[a-zA-Z0-9._:@-]+$
    JobResult:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - jobId
          - operation
          - taskKind
          - artifacts
          - provenance
          properties:
            jobId:
              type: string
              minLength: 1
              maxLength: 160
              pattern: ^[a-zA-Z0-9._:@-]+$
            operation:
              const: vision.predict
            taskKind:
              const: image.classification
            artifacts:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - artifactId
                - mediaType
                - sha256
                - byteLength
                - accessTier
                properties:
                  artifactId:
                    type: string
                    minLength: 1
                    maxLength: 160
                    pattern: ^[a-zA-Z0-9._:@-]+$
                  mediaType:
                    type: string
                    minLength: 3
                  sha256:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  byteLength:
                    type: integer
                    minimum: 0
                  accessTier:
                    enum:
                    - workspace
                    - restricted
                    - public-demo
            provenance:
              type: object
              additionalProperties: false
              required:
              - inputSha256
              - modelRevision
              - preprocessFingerprint
              - contractVersion
              properties:
                inputSha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                modelRevision:
                  type: string
                  minLength: 1
                  maxLength: 160
                  pattern: ^[a-zA-Z0-9._:@-]+$
                preprocessFingerprint:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                contractVersion:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
        meta:
          type: object
          additionalProperties: false
          required:
          - requestId
          - contractVersion
          properties:
            requestId:
              type: string
              minLength: 1
              maxLength: 160
              pattern: ^[a-zA-Z0-9._:@-]+$
            contractVersion:
              type: string
              pattern: ^\d+\.\d+\.\d+$
    ArtifactRef:
      type: object
      additionalProperties: false
      required:
      - artifactId
      - mediaType
      - sha256
      - byteLength
      - accessTier
      properties:
        artifactId:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[a-zA-Z0-9._:@-]+$
        mediaType:
          type: string
          minLength: 3
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byteLength:
          type: integer
          minimum: 0
        accessTier:
          enum:
          - workspace
          - restricted
          - public-demo
